name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Creer le projet Android
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MonSite"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.monsite.webview"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.monsite.webview"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.MonSite"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:hardwareAccelerated="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java/com/monsite/webview
          cat > app/src/main/java/com/monsite/webview/MainActivity.kt <<'EOF'
          package com.monsite.webview

          import android.annotation.SuppressLint
          import android.graphics.Bitmap
          import android.os.Bundle
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.ProgressBar
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          // >>> CHANGE L'URL ICI <<<
          private const val SITE_URL = "https://www.youtube.com/@CrunchyrollFR"

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private lateinit var progress: ProgressBar
              private lateinit var root: FrameLayout
              private var customView: View? = null
              private var customViewCallback: WebChromeClient.CustomViewCallback? = null
              private lateinit var chromeClient: WebChromeClient

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  root = FrameLayout(this)
                  webView = WebView(this)
                  progress = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 100
                      visibility = View.GONE
                  }
                  root.addView(webView, FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                  root.addView(progress, FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 8))
                  setContentView(root)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                      loadWithOverviewMode = true
                      useWideViewPort = true
                  }
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true)

                  // Les liens restent dans l'application
                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val scheme = request.url.scheme ?: return false
                          // http/https restent dans l'appli ; les autres schémas sont ignorés
                          return scheme != "http" && scheme != "https"
                      }
                      override fun onPageStarted(view: WebView, url: String?, favicon: Bitmap?) {
                          progress.visibility = View.VISIBLE
                      }
                      override fun onPageFinished(view: WebView, url: String?) {
                          progress.visibility = View.GONE
                      }
                  }

                  // Barre de chargement + vidéo plein écran
                  chromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView, newProgress: Int) {
                          progress.progress = newProgress
                      }

                      override fun onShowCustomView(view: View, callback: WebChromeClient.CustomViewCallback) {
                          if (customView != null) {
                              callback.onCustomViewHidden()
                              return
                          }
                          customView = view
                          customViewCallback = callback
                          webView.visibility = View.GONE
                          root.addView(view, FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                          setImmersive(true)
                      }

                      override fun onHideCustomView() {
                          customView?.let { root.removeView(it) }
                          customView = null
                          customViewCallback?.onCustomViewHidden()
                          customViewCallback = null
                          webView.visibility = View.VISIBLE
                          setImmersive(false)
                      }
                  }

                  webView.webChromeClient = chromeClient

                  // Bouton Retour : revient en arrière dans le site, sinon quitte
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          when {
                              customView != null -> chromeClient.onHideCustomView()
                              webView.canGoBack() -> webView.goBack()
                              else -> {
                                  isEnabled = false
                                  onBackPressedDispatcher.onBackPressed()
                              }
                          }
                      }
                  })

                  if (savedInstanceState == null) {
                      webView.loadUrl(SITE_URL)
                  } else {
                      webView.restoreState(savedInstanceState)
                  }
              }

              private fun setImmersive(enable: Boolean) {
                  val controller = WindowInsetsControllerCompat(window, window.decorView)
                  WindowCompat.setDecorFitsSystemWindows(window, !enable)
                  if (enable) {
                      controller.hide(WindowInsetsCompat.Type.systemBars())
                      controller.systemBarsBehavior =
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  } else {
                      controller.show(WindowInsetsCompat.Type.systemBars())
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  webView.saveState(outState)
              }

              override fun onPause() { super.onPause(); webView.onPause() }
              override fun onResume() { super.onResume(); webView.onResume() }

              override fun onDestroy() {
                  root.removeAllViews()
                  webView.destroy()
                  super.onDestroy()
              }
          }
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Mon Site</string>
          </resources>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.MonSite" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>
          </resources>
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#F47521" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M42,32L42,76L78,54z" />
          </vector>
          EOF

      - name: Compiler l APK
        run: gradle assembleDebug --no-daemon

      - name: Publier l APK dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MonSite.apk
          gh release create "apk-${{ github.run_number }}" MonSite.apk --title "MonSite APK ${{ github.run_number }}" --notes "APK pret a installer sur Android"
